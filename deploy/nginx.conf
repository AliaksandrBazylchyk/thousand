# Сайт nginx для «Тысячи». Заменить thousand.example.org на свой домен.
# Установка: sudo cp deploy/nginx.conf /etc/nginx/sites-available/thousand
#            sudo ln -s /etc/nginx/sites-available/thousand /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d thousand.example.org (certbot сам допишет блок 443 и редирект).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream thousand {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name thousand.example.org;

    # Закрытый домен: поисковикам здесь делать нечего.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    # Socket.IO: WebSocket и long polling.
    location /socket.io/ {
        proxy_pass http://thousand;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # REST, фронтенд и всё остальное отдаёт Node.js.
    location / {
        proxy_pass http://thousand;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
