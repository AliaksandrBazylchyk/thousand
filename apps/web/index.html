<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a07" />
    <meta
      name="description"
      content="Счёт, история партий и статистика для живой игры в «Тысячу»."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Тысяча" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Тысяча</title>
    <script>
      // Тема из настроек до отрисовки, чтобы не мигал светлый экран.
      try {
        var t = JSON.parse(localStorage.getItem('thousand:settings') || '{}').theme || 'tavern';
        if (t !== 'auto') document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'tavern';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
